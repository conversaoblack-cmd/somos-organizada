# Varredura de segredos (gitleaks): regras padrão + falsos positivos já conferidos.
# Antes de acrescentar uma exceção aqui, confirme que NÃO é chave de verdade. Chave real que vazou: troque a chave.
title = "Somos Organizada"

[extend]
useDefault = true

# Chaves falsas da Pagar.me simulada nos testes (sk_test_/pk_test_ inventadas, só valem nos emuladores)
[[allowlists]]
description = "chaves inventadas dos testes"
condition = "AND"
paths = ['''^testes-e2e/''']
regexes = ['''(sk|pk)_(test|demo|live)_[A-Za-z0-9]+''']

